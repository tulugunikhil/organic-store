apiVersion: v1
kind: ServiceAccount
metadata:
  name: jenkins-deployer
  namespace: pureharvest
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: jenkins-deployer
  namespace: pureharvest
rules:
  - apiGroups: ["", "apps"]
    resources: ["services", "deployments", "pods"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jenkins-deployer
  namespace: pureharvest
subjects:
  - kind: ServiceAccount
    name: jenkins-deployer
    namespace: pureharvest
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: jenkins-deployer
