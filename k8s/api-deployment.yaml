apiVersion: apps/v1
kind: Deployment
metadata:
  name: pureharvest-api
  namespace: pureharvest
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pureharvest-api
  template:
    metadata:
      labels:
        app: pureharvest-api
    spec:
      containers:
        - name: api
          image: docker.io/library/node:22-alpine
          imagePullPolicy: IfNotPresent
          workingDir: /app
          command: ["node", "server.js"]
          ports:
            - name: http
              containerPort: 5000
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "5000"
          envFrom:
            - secretRef:
                name: pureharvest-api-secrets
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: pureharvest-api
  namespace: pureharvest
spec:
  selector:
    app: pureharvest-api
  ports:
    - name: http
      port: 5000
      targetPort: http
